name: dotnet publish

on:
  push:
    branches:
      - master

jobs:
  build:
    strategy:
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            src_binary: bin/win-x64/reecon.exe
            final_name: reecon.exe
          - rid: linux-x64
            os: ubuntu-latest
            src_binary: bin/linux-x64/reecon
            final_name: reecon-linux-x64
          - rid: linux-arm64
            os: ubuntu-24.04-arm
            src_binary: bin/linux-arm64/reecon
            final_name: reecon-linux-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.103'

      - name: Publish Native AOT
        shell: bash
        run: |
          dotnet publish -r ${{ matrix.rid }} \
            --self-contained true \
            --configuration Release \
            -p:PublishAot=true \
            -p:PublishDir=bin/${{ matrix.rid }}/ \
            -p:AssemblyName=reecon

          # Stage and rename the binary so the artifact contains the correct filename
          mkdir -p dist
          mv ${{ matrix.src_binary }} dist/${{ matrix.final_name }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.final_name }}
          path: dist/${{ matrix.final_name }}
          if-no-files-found: error

  # Musl builds need an Alpine environment to link against musl libc
  build-musl:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0-alpine
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools for Native AOT on Alpine
        run: apk add --no-cache clang build-base zlib-dev

      - name: Publish Native AOT (musl)
        run: |
          dotnet publish -r linux-musl-x64 \
            --self-contained true \
            --configuration Release \
            -p:PublishAot=true \
            -p:PublishDir=bin/linux-musl-x64/ \
            -p:AssemblyName=reecon

          mkdir -p dist
          mv bin/linux-musl-x64/reecon dist/reecon-linux-musl-x64

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: reecon-linux-musl-x64
          path: dist/reecon-linux-musl-x64
          if-no-files-found: error

  release:
    needs: [build, build-musl]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-bin/
          merge-multiple: true

      - name: Automatic Releases
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "latest"
          prerelease: true
          title: "Latest Development Build"
          files: |
            release-bin/reecon.exe
            release-bin/reecon-linux-x64
            release-bin/reecon-linux-arm64
            release-bin/reecon-linux-musl-x64
